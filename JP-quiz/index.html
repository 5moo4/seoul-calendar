<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18212f" />
  <meta name="description" content="히라가나 가타카나 스피드 퀴즈" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>히라가나 가타카나 스피드 퀴즈</title>
</head>
<body>
  <main class="app-shell">
    <section id="start-screen" class="screen start-screen" aria-labelledby="app-title">
      <div class="start-content">
        <p class="eyebrow">3초 스피드 훈련</p>
        <h1 id="app-title">히라가나 가타카나<br>스피드 퀴즈</h1>
        <div class="count-picker">
          <p>맞추고 싶은 문제 몇 개?</p>
          <div class="picker-row">
            <button id="decrease" class="triangle-button" aria-label="문제 수 줄이기">◀</button>
            <output id="question-count" aria-live="polite">50</output>
            <button id="increase" class="triangle-button" aria-label="문제 수 늘리기">▶</button>
          </div>
        </div>
        <fieldset class="script-picker">
          <legend>출제 범위</legend>
          <div class="script-options">
            <label><input type="radio" name="script" value="hiragana"> <span>히라가나만</span></label>
            <label><input type="radio" name="script" value="katakana"> <span>가타카나만</span></label>
            <label><input type="radio" name="script" value="both" checked> <span>히라가나 &amp; 가타카나</span></label>
          </div>
        </fieldset>
        <button id="start-button" class="primary-button">START</button>
      </div>
    </section>

    <section id="quiz-screen" class="screen quiz-screen" hidden aria-live="polite">
      <div class="quiz-header">
        <span id="progress-label">0 / 50</span>
        <div class="progress-track" aria-label="완료한 고유 문제 진행"><div id="progress-fill"></div></div>
      </div>
      <div class="question-card"><p id="question" lang="ja">あさ</p></div>
      <div class="timer-track" aria-label="남은 시간"><div id="timer-fill"></div></div>
      <div id="choices" class="choices" aria-label="정답 선택지"></div>
      <p id="feedback" class="feedback" aria-live="assertive"></p>
    </section>

    <section id="result-screen" class="screen result-screen" hidden aria-labelledby="result-title">
      <div class="result-card">
        <p class="eyebrow">COMPLETE</p>
        <h2 id="result-title">모든 문제를 맞혔어요</h2>
        <dl class="stats">
          <div><dt>총 도전</dt><dd id="attempts-stat">0</dd></div>
          <div><dt>오답</dt><dd id="wrong-stat">0</dd></div>
          <div><dt>시간초과</dt><dd id="timeout-stat">0</dd></div>
          <div><dt>소요시간</dt><dd id="elapsed-stat">0초</dd></div>
        </dl>
        <div class="result-actions">
          <button id="retry-button" class="primary-button">다시 하기</button>
          <button id="home-button" class="secondary-button">처음으로</button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
